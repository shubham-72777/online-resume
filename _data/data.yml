career-profile:
  title: Career Profile
  summary: |
    Over 3.9 years of experience in Information Technology specializing in Software Quality Assurance Testing with expertise in Web based applications and Core Java.

    Extensive experience in all phases of SDLC using Agile, Scrum and Waterfall methodologies.

    Proficient in Selenium WebDriver, TestNG, Cucumber, Maven, SQL, API Testing and Automation Framework development including Data Driven, Hybrid, POM and BDD frameworks.

    Strong expertise in Functional Testing, Regression Testing, Smoke Testing, Backend Testing, UAT, Cross Browser Testing and Database Validation.

    Hands-on experience with tools such as Selenium, TestNG, XRAY, HP ALM, JIRA, Postman, SQL Server, Oracle, Git and UNIX commands.

